# BrowserStack Automate config (used by browserstack-node-sdk)
# Add your credentials below, or export BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY.
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: BankAura - Web Testing
buildName: bank-aura
buildIdentifier: '#${BUILD_NUMBER}'

platforms:
  # Desktop browsers (full-width resolution)
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest
  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest
  # Mobile device (real device)
  - deviceName: Samsung Galaxy S23
    osVersion: 13.0
    browserName: chrome
    deviceOrientation: portrait

parallelsPerPlatform: 1

# Full-width desktop screen resolution for every desktop session
resolution: 1920x1080

# Accessibility testing (runs on Chrome / Edge sessions)
# accessibility: true
# accessibilityOptions:
#   wcagVersion: wcag21aa
#   includeIssueType:
#     bestPractice: true
#     needsReview: true

browserstackLocal: false

# AI self-healing of broken locators
selfHeal: true

# Reports, logs and debugging (trimmed while diagnosing the Percy screenshot executor failure)
debug: true
networkLogs: true
consoleLogs: errors
telemetryLogs: true
testObservability: true

browserProfiling: true

